<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Rank Rush</title>
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="%230b0d12"/><text x="16" y="23" font-size="22" text-anchor="middle" fill="%23f4f7ff">&#9812;</text></svg>' />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #07090d;
        color: #dfe6f5;
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      header { padding: 10px 16px 6px; border-bottom: 1px solid #1b2130; }
      h1 { margin: 0; font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; color: #8ea3c8; }
      #hud { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #6c7d9c; }
      #hud span { display: flex; flex-direction: column; }
      #hud b { font-size: 17px; color: #eaf0ff; letter-spacing: 0; }
      main { display: grid; grid-template-columns: 1fr 240px; min-height: 0; }
      #stage { position: relative; min-height: 0; }
      canvas { display: block; touch-action: none; }
      aside { border-left: 1px solid #1b2130; padding: 10px 12px; overflow: auto; font-size: 12px; color: #8b9bba; }
      aside h2 { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #566a8e; margin: 0 0 8px; }
      #log div { padding: 2px 0; border-bottom: 1px solid #131826; }
      #promo, #over {
        position: absolute; inset: 0; display: grid; place-content: center; gap: 10px;
        background: rgba(7, 9, 13, 0.86); text-align: center;
      }
      #promo[hidden], #over[hidden] { display: none; }
      #promo div { display: flex; gap: 8px; }
      button {
        font: inherit; padding: 8px 14px; border-radius: 6px; cursor: pointer;
        background: #1d2634; color: #e6edff; border: 1px solid #2e3a4f;
      }
      button:hover { background: #26324a; }
      h2 { margin: 0; }
      @media (max-width: 720px) { main { grid-template-columns: 1fr; } aside { display: none; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Rank Rush</h1>
      <div id="hud"></div>
    </header>
    <main>
      <div id="stage">
        <canvas id="board"></canvas>
        <div id="promo" hidden>
          <h2>Promote to</h2>
          <div>
            <button data-promo="knight">knight</button>
            <button data-promo="bishop">bishop</button>
            <button data-promo="rook">rook</button>
            <button data-promo="queen">queen</button>
          </div>
        </div>
        <div id="over" hidden></div>
      </div>
      <aside>
        <h2>Field report</h2>
        <div id="log"></div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
